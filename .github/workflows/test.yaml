name: Test
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.15'
          enable-cache: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcli11-dev
      - name: Install
        run: |
          uv sync --locked
      - name: Up
        id: up
        run: |
          uv run --no-sync dora up
      - name: Run
        run: |
          uv run --no-sync dora start dataflow_dummy.yaml --attach &
          # Wait for the UI node's HTTP server
          for i in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:8000/; then
              break
            fi
            sleep 1
          done
          curl -X POST http://127.0.0.1:8000/start
          sleep 1
          curl -X POST http://127.0.0.1:8000/success
          sleep 3
          curl -X POST http://127.0.0.1:8000/quit
          wait
      - name: Down
        if: ${{ always() && steps.up.outcome == 'success' }}
        run: |
          uv run --no-sync dora down --force
      - uses: actions/upload-artifact@v7
        with:
          name: dataset
          path: dataset/
