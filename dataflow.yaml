# Teleoperation and data collection. The leader and the robot are modules
# picked by environment variables:
#
#   LEADER=ker|vr|webxr|dummy          leader-$LEADER.yaml   (default: dummy)
#   ROBOT=cell|pedestal|mujoco|dummy   robot-$ROBOT.yaml     (default: dummy)
#
# dora doesn't expand environment variables in `module:`, so run it through
# scripts/dora-envsubst, which does:
#
#   LEADER=webxr ROBOT=mujoco scripts/dora-envsubst run dataflow.yaml --uv
#
# See docs/design.md for the rules to follow when changing the modules.

nodes:
  - id: ui
    path: dora-openarm-data-collection-ui
    env:
      METADATA_FILE: "metadata_${ROBOT:-dummy}.yaml"
    inputs:
      # We need at least one input to keep this node alive.
      tick: dora/timer/secs/1
      # Episode buttons and receive rate of a VR leader.
      button_a:
        source: leader/button_a
        queue_size: 100
      button_b:
        source: leader/button_b
        queue_size: 100
      vr_receive_times:
        source: leader/vr_receive_times
        queue_size: 100
      # KER receive rate and device information for the UI leader panel.
      ker_position: leader/ker_position
      ker_metadata: leader/metadata
      camera_wrist_right:
        source: robot/camera_wrist_right
        queue_size: 1
      camera_wrist_left:
        source: robot/camera_wrist_left
        queue_size: 1
      camera_head_left:
        source: robot/camera_head_left
        queue_size: 1
      camera_head_right:
        source: robot/camera_head_right
        queue_size: 1
      camera_ceiling:
        source: robot/camera_ceiling
        queue_size: 1
      arm_status_right: robot/status_right
      arm_status_left: robot/status_left
      # Motor temperatures and CAN bus state for the UI motor panel.
      arm_state_right: robot/arm_state_right
      arm_state_left: robot/arm_state_left
    outputs:
      - command
      - arm_command

  - id: quittable-tick-leader
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      # 250Hz
      tick: dora/timer/millis/4
    outputs:
      - tick

  - id: quittable-tick-camera
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      # 30fps
      tick: dora/timer/millis/33
    outputs:
      - tick

  - id: leader
    module: leader-${LEADER:-dummy}.yaml
    inputs:
      tick: quittable-tick-leader/tick
      camera_head_left: robot/camera_head_left
      camera_head_right: robot/camera_head_right

  - id: robot
    module: robot-${ROBOT:-dummy}.yaml
    inputs:
      tick: quittable-tick-leader/tick
      camera_tick: quittable-tick-camera/tick
      command: ui/command
      arm_command: ui/arm_command
      position_right: leader/follower_position_right
      position_left: leader/follower_position_left
      joystick_y: leader/joystick_y_left
      button_x: leader/button_x
      pose_right: leader/pose_right
      pose_left: leader/pose_left

  - id: recorder
    path: dora-openarm-dataset-recorder
    env:
      METADATA_FILE: "metadata_${ROBOT:-dummy}.yaml"
      # Output directory for recorded datasets, e.g. data/webxr-mujoco.
      DIRECTORY: "data/${LEADER:-dummy}-${ROBOT:-dummy}"
    inputs:
      command: ui/command
      arm_right_action: leader/follower_position_right
      arm_left_action: leader/follower_position_left
      arm_right_observation: robot/state_right
      arm_left_observation: robot/state_left
      camera_wrist_right: robot/camera_wrist_right
      camera_wrist_left: robot/camera_wrist_left
      camera_head_left: robot/camera_head_left
      camera_head_right: robot/camera_head_right
      camera_ceiling: robot/camera_ceiling
      ker_metadata: leader/metadata
      elevation_action: robot/elevation_action
      elevation_observation: robot/elevation_observation
