# Experimental: every dataflow (KER / VR / WebXR / dummy leaders and
# real cell / MuJoCo / dummy robots) merged into one, switched by environment
# variables through dora-openarm-selector nodes:
#
#   LEADER=ker|vr|webxr|dummy   which leader drives the arms   (default: ker)
#   ROBOT=cell|mujoco|dummy     which robot moves and is recorded (default: cell)
#
#   LEADER=webxr ROBOT=mujoco dora run dataflow-main.yaml --uv
#
# Every node starts whatever is selected, but nodes that need hardware or a
# port (KER, Quest/WebXR receivers, CAN followers, lifter, cameras, MuJoCo)
# run through dora-openarm-standby: when they aren't selected they stand by
# without opening anything, so e.g. LEADER=dummy ROBOT=dummy needs no device.
# The real followers run only with a real leader (ker, vr or webxr) and
# ROBOT=cell, so LEADER=dummy ROBOT=cell never moves the real arms.
#
# Selectors:
#   action-selector       LEADER picks the joint targets (and VR buttons/joystick).
#   robot-router          ROBOT routes those targets to one robot only, so the
#                         real arms don't move while ROBOT=mujoco.
#   state-selector        ROBOT picks the arm state and lifter that are recorded.
#   camera-selector       ROBOT picks the cameras that are shown and recorded.
#
# Not merged: dataflow-pedestal.yaml. Its followers use another --config on
# the same CAN buses, and args can't come from environment variables.
#
# Nodes run with this file's directory (dataflow/) as their working directory,
# so file paths in env are relative to it and start with `../`.

nodes:
  - id: ui
    path: dora-openarm-data-collection-ui
    env:
      # Use ../metadata_mujoco.yaml or ../metadata_dummy.yaml for the other
      # robots. A default can't depend on ROBOT, so set METADATA_FILE.
      METADATA_FILE: "${METADATA_FILE:-../metadata.yaml}"
    inputs:
      # We need at least one input to keep this node alive.
      tick: dora/timer/secs/1
      # Episode buttons and receive rate of the selected VR leader.
      button_a:
        source: action-selector/button_a
        queue_size: 100
      button_b:
        source: action-selector/button_b
        queue_size: 100
      vr_receive_times:
        source: action-selector/receive_times
        queue_size: 100
      # Cameras of the selected robot.
      camera_wrist_right:
        source: camera-selector/wrist_right
        queue_size: 1
      camera_wrist_left:
        source: camera-selector/wrist_left
        queue_size: 1
      camera_head_left:
        source: camera-selector/head_left
        queue_size: 1
      camera_head_right:
        source: camera-selector/head_right
        queue_size: 1
      camera_ceiling:
        source: camera-selector/ceiling
        queue_size: 1
      # Real cell only.
      arm_status_right:
        source: followers.right/status
      arm_status_left:
        source: followers.left/status
      # Motor temperatures and CAN bus state for the UI motor panel.
      arm_state_right: followers.right/state
      arm_state_left: followers.left/state
      # KER receive rate and device information for the UI leader panel.
      ker_position: leader-ker/follower_position_right
      ker_metadata: leader-ker/metadata
    outputs:
      - command
      - arm_command

  - id: quittable-tick-leader
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      # 250Hz
      tick: dora/timer/millis/4
    outputs:
      - tick

  - id: quittable-tick-camera
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      tick: dora/timer/millis/33 # 30fps
    outputs:
      - tick

  # ---------------------------------------------------------------- leaders

  # Each leader is a module in modules/leader-*.yaml.
  - id: leader-ker
    module: modules/leader-ker.yaml
    inputs:
      tick: quittable-tick-leader/tick

  - id: leader-dummy
    module: modules/leader-dummy.yaml
    inputs:
      tick: quittable-tick-leader/tick

  - id: leader-vr
    module: modules/leader-vr.yaml
    inputs:
      tick: quittable-tick-leader/tick

  - id: leader-webxr
    module: modules/leader-webxr.yaml
    inputs:
      tick: quittable-tick-leader/tick
      command: ui/command

  # Input IDs are <source>_<channel>; only the LEADER source is forwarded.
  - id: action-selector
    path: dora-openarm-selector
    env:
      SOURCES: "${LEADER:-ker}"
    inputs:
      # Rate hint for dora-openarm-dataset-recorder, which finds a stream's
      # rate by following its source node's `tick`, `request_state` or
      # `request_position` input to a dora/timer. The selector ignores this
      # input: its source part `request` isn't in SOURCES. The proper fix is
      # for the recorder to look through selectors.
      request_state: quittable-tick-leader/tick
      ker_right: leader-ker/follower_position_right
      ker_left: leader-ker/follower_position_left
      dummy_right: leader-dummy/follower_position_right
      dummy_left: leader-dummy/follower_position_left
      vr_right: leader-vr/position_right
      vr_left: leader-vr/position_left
      vr_joystick: leader-vr/joystick_y_left
      vr_button_a: leader-vr/button_a
      vr_button_b: leader-vr/button_b
      vr_button_x: leader-vr/button_x
      vr_receive_times: leader-vr/vr_receive_times
      webxr_right: leader-webxr/position_right
      webxr_left: leader-webxr/position_left
      webxr_joystick: leader-webxr.quit/joystick_y_left
      webxr_button_a: leader-webxr.quit/button_a
      webxr_button_b: leader-webxr.quit/button_b
      webxr_button_x: leader-webxr.quit/button_x
      webxr_receive_times: leader-webxr.quit/vr_receive_times
    outputs:
      - right
      - left
      - joystick
      - button_a
      - button_b
      - button_x
      - receive_times
      - selected

  # ----------------------------------------------------------------- robots

  # Used as a router: each robot gets its own channel name, so only the
  # ROBOT source's channels are sent and the other robots receive nothing.
  - id: robot-router
    path: dora-openarm-selector
    env:
      SOURCES: "${ROBOT:-cell}"
    inputs:
      cell_cell_right: action-selector/right
      cell_cell_left: action-selector/left
      cell_cell_joystick: action-selector/joystick
      mujoco_mujoco_right: action-selector/right
      mujoco_mujoco_left: action-selector/left
      mujoco_mujoco_joystick: action-selector/joystick
      mujoco_mujoco_button_x: action-selector/button_x
      dummy_dummy_right: action-selector/right
      dummy_dummy_left: action-selector/left
    outputs:
      - cell_right
      - cell_left
      - cell_joystick
      - mujoco_right
      - mujoco_left
      - mujoco_joystick
      - mujoco_button_x
      - dummy_right
      - dummy_left
      - selected

  # Real cell: followers on CAN, lifter, 4 cameras + stereo splitter.
  - id: followers
    module: modules/followers.yaml
    inputs:
      position_right: robot-router/cell_right
      position_left: robot-router/cell_left
      command: ui/arm_command

  - id: lifter
    path: dora-openarm-standby
    args: dora-openarm-cell-lifter
    env:
      # Real cell only: stands by while ROBOT is something else.
      SELECTED: "${ROBOT:-cell}"
      RUN_WHEN: cell
    inputs:
      # The tick keeps the built-in hold behavior; the joystick comes only
      # from a VR leader while ROBOT=cell.
      tick: quittable-tick-leader/tick
      joystick_y: robot-router/cell_joystick
    outputs:
      - elevation_observation
      - elevation_action

  - id: cameras
    module: modules/cameras.yaml
    inputs:
      tick: quittable-tick-camera/tick

  # MuJoCo: simulated arms and 5 rendered cameras.
  - id: mujoco-collect
    path: dora-openarm-standby
    args: "dora-openarm-mujoco --scene demo --keyframe home --enable-collision --ctrl --viewer --render"
    env:
      # Stands by (no viewer window) while ROBOT is something else.
      SELECTED: "${ROBOT:-cell}"
      RUN_WHEN: mujoco
    inputs:
      move_position_right: robot-router/mujoco_right
      move_position_left: robot-router/mujoco_left
      request_state: quittable-tick-leader/tick
      joystick_y: robot-router/mujoco_joystick
      button_x: robot-router/mujoco_button_x
    outputs:
      - status
      - state_right
      - state_left
      - camera_wrist_right
      - camera_wrist_left
      - camera_head_left
      - camera_head_right
      - camera_ceiling

  # Dummy: no hardware; the head camera is one stream.
  - id: dummy-follower-right
    path: dora-openarm-dummy
    inputs:
      request_position: robot-router/dummy_right
      move_position: robot-router/dummy_right
    outputs:
      - position
      - status

  - id: dummy-follower-left
    path: dora-openarm-dummy
    inputs:
      request_position: robot-router/dummy_left
      move_position: robot-router/dummy_left
    outputs:
      - position
      - status

  - id: dummy-camera-wrist-right
    path: dora-openarm-dummy-camera
    env: &dummy_camera_env
      ENCODING: "jpeg"
      IMAGE_HEIGHT: 600
      IMAGE_WIDTH: 960
      JPEG_QUALITY: 90
    inputs:
      tick: quittable-tick-camera/tick
    outputs:
      - image

  - id: dummy-camera-wrist-left
    path: dora-openarm-dummy-camera
    env: *dummy_camera_env
    inputs:
      tick: quittable-tick-camera/tick
    outputs:
      - image

  - id: dummy-camera-head
    path: dora-openarm-dummy-camera
    env: *dummy_camera_env
    inputs:
      tick: quittable-tick-camera/tick
    outputs:
      - image

  - id: dummy-camera-ceiling
    path: dora-openarm-dummy-camera
    env: *dummy_camera_env
    inputs:
      tick: quittable-tick-camera/tick
    outputs:
      - image

  # ROBOT picks the observations that are recorded. Arm state and the lifter
  # (250 Hz) and cameras (30 Hz) are split into two selectors so that each
  # one carries a single rate; see `request_state` below.
  - id: state-selector
    path: dora-openarm-selector
    env:
      SOURCES: "${ROBOT:-cell}"
    inputs:
      # Rate hint for the recorder; see action-selector.
      request_state: quittable-tick-leader/tick
      cell_right: followers.right/state
      cell_left: followers.left/state
      cell_elevation_action: lifter/elevation_action
      cell_elevation_observation: lifter/elevation_observation
      mujoco_right: mujoco-collect/state_right
      mujoco_left: mujoco-collect/state_left
      dummy_right: dummy-follower-right/position
      dummy_left: dummy-follower-left/position
    outputs:
      - right
      - left
      - elevation_action
      - elevation_observation
      - selected

  - id: camera-selector
    path: dora-openarm-selector
    env:
      SOURCES: "${ROBOT:-cell}"
    inputs:
      # Rate hint for the recorder; see action-selector.
      request_state: quittable-tick-camera/tick
      cell_wrist_right: cameras.wrist-right/image
      cell_wrist_left: cameras.wrist-left/image
      cell_head_left: cameras.head-stereo-splitter/image_0
      cell_head_right: cameras.head-stereo-splitter/image_1
      cell_ceiling: cameras.ceiling/image
      mujoco_wrist_right: mujoco-collect/camera_wrist_right
      mujoco_wrist_left: mujoco-collect/camera_wrist_left
      mujoco_head_left: mujoco-collect/camera_head_left
      mujoco_head_right: mujoco-collect/camera_head_right
      mujoco_ceiling: mujoco-collect/camera_ceiling
      dummy_wrist_right: dummy-camera-wrist-right/image
      dummy_wrist_left: dummy-camera-wrist-left/image
      dummy_head_left: dummy-camera-head/image
      dummy_ceiling: dummy-camera-ceiling/image
    outputs:
      - wrist_right
      - wrist_left
      - head_left
      - head_right
      - ceiling
      - selected

  - id: recorder
    path: dora-openarm-dataset-recorder
    env:
      METADATA_FILE: "${METADATA_FILE:-../metadata.yaml}"
      # Output directory for recorded datasets, e.g. ../data/webxr-mujoco.
      DIRECTORY: "../data/${LEADER:-ker}-${ROBOT:-cell}"
    inputs:
      command: ui/command
      arm_right_action: action-selector/right
      arm_left_action: action-selector/left
      arm_right_observation: state-selector/right
      arm_left_observation: state-selector/left
      camera_wrist_right: camera-selector/wrist_right
      camera_wrist_left: camera-selector/wrist_left
      camera_head_left: camera-selector/head_left
      camera_head_right: camera-selector/head_right
      camera_ceiling: camera-selector/ceiling
      ker_metadata: leader-ker/metadata
      elevation_action: state-selector/elevation_action
      elevation_observation: state-selector/elevation_observation
