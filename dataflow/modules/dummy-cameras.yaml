module:
  name: dummy-cameras
  inputs: [tick]
  # No declared outputs: every camera emits `image`, and a declared output must
  # have exactly one producer. Reference them from the parent as
  # `cameras.wrist-right/image`, `cameras.head/image`, etc.

# Inner `path:` starts with `../` because dora resolves it relative to this
# file; a bare executable name would become `modules/<name>`.
nodes:
  - id: wrist-right
    path: ../dora-openarm-dummy-camera
    env: &dummy_camera_env
      ENCODING: "jpeg"
      IMAGE_HEIGHT: 600
      IMAGE_WIDTH: 960
      JPEG_QUALITY: 90
    inputs:
      tick: _mod/tick
    outputs:
      - image

  - id: wrist-left
    path: ../dora-openarm-dummy-camera
    env: *dummy_camera_env
    inputs:
      tick: _mod/tick
    outputs:
      - image

  - id: head
    path: ../dora-openarm-dummy-camera
    env: *dummy_camera_env
    inputs:
      tick: _mod/tick
    outputs:
      - image

  - id: ceiling
    path: ../dora-openarm-dummy-camera
    env: *dummy_camera_env
    inputs:
      tick: _mod/tick
    outputs:
      - image
