module:
  name: dummy-followers
  inputs: [position_right, position_left]
  # No declared outputs: both followers emit `position`/`status`, and a
  # declared output must have exactly one producer. Reference them from the
  # parent as `followers.right/position`, `followers.left/status`, etc.

# Inner `path:` starts with `../` because dora resolves it relative to this
# file; a bare executable name would become `modules/<name>`.
nodes:
  - id: right
    path: ../dora-openarm-dummy
    inputs:
      # Event ID is only used. Event value isn't used.
      request_position: _mod/position_right
      move_position: _mod/position_right
    outputs:
      - position
      - status

  - id: left
    path: ../dora-openarm-dummy
    inputs:
      request_position: _mod/position_left
      move_position: _mod/position_left
    outputs:
      - position
      - status
