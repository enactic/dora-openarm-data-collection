# LEADER=ker: KER leader arms over USB send joint positions directly.
module:
  name: leader-ker
  inputs: [tick]
  outputs: [follower_position_right, follower_position_left, metadata]

# Inner `path:` starts with `../` because dora resolves it relative to this
# file; a bare executable name would become `modules/<name>`.
nodes:
  - id: ker
    path: ../dora-openarm-standby
    args: dora-openarm-ker
    env:
      # Stands by (no USB device opened) while LEADER is something else.
      SELECTED: "${LEADER:-ker}"
      RUN_WHEN: ker
    inputs:
      tick: _mod/tick
    outputs:
      - follower_position_left
      - follower_position_right
      - metadata
