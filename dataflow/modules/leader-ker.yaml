# LEADER=ker: KER leader arms over USB send joint positions directly.
#
# Every leader-*.yaml declares the same inputs and outputs so that
# each dataflow/robot-*.yaml can wire whichever one LEADER picks. Outputs that this
# leader doesn't have are declared on a node that never sends them.
module:
  name: leader-ker
  inputs: [tick, command]
  outputs:
    - follower_position_right
    - follower_position_left
    - joystick_y_left
    - button_a
    - button_b
    - button_x
    - vr_receive_times
    - ker_position
    - metadata

# Inner `path:` starts with `../` because dora resolves it relative to this
# file; a bare executable name would become `modules/<name>`.
nodes:
  - id: ker
    path: ../dora-openarm-ker
    inputs:
      tick: _mod/tick
    outputs:
      - follower_position_left
      - follower_position_right
      - metadata
      # Not sent by KER.
      - joystick_y_left
      - button_a
      - button_b
      - button_x
      - vr_receive_times

  # The UI shows the KER panel once `ker_position` arrives, so only this
  # leader sends it. A module output keeps its inner name, hence the rename.
  - id: ui-rate
    path: ../dora-openarm-quitter
    inputs:
      command: _mod/command
      ker_position: ker/follower_position_right
    outputs:
      - ker_position
