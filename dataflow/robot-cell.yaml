# ROBOT=cell: the real Cell. Followers on CAN, lifter, 4 cameras + stereo
# splitter.
#
# Experimental: one dataflow per robot, with the leader picked by LEADER:
#
#   LEADER=ker|vr|webxr|dummy   modules/leader-$LEADER.yaml   (default: ker)
#
# dora doesn't expand environment variables in `module:`, so run it through
# scripts/dora-envsubst, which does:
#
#   LEADER=webxr scripts/dora-envsubst run dataflow/robot-cell.yaml --uv
#
# All leader modules have the same inputs and outputs; see
# modules/leader-ker.yaml.
#
# Nodes run with this file's directory (dataflow/) as their working directory,
# so file paths in env are relative to it and start with `../`.

nodes:
  - id: ui
    path: dora-openarm-data-collection-ui
    env:
      METADATA_FILE: "${METADATA_FILE:-../metadata.yaml}"
    inputs:
      # We need at least one input to keep this node alive.
      tick: dora/timer/secs/1
      # Episode buttons and receive rate of a VR leader.
      button_a:
        source: leader/button_a
        queue_size: 100
      button_b:
        source: leader/button_b
        queue_size: 100
      vr_receive_times:
        source: leader/vr_receive_times
        queue_size: 100
      # KER receive rate and device information for the UI leader panel.
      ker_position: leader/ker_position
      ker_metadata: leader/metadata
      camera_wrist_right:
        source: cameras.wrist-right/image
        queue_size: 1
      camera_wrist_left:
        source: cameras.wrist-left/image
        queue_size: 1
      camera_head_left:
        source: cameras.head-stereo-splitter/image_0
        queue_size: 1
      camera_head_right:
        source: cameras.head-stereo-splitter/image_1
        queue_size: 1
      camera_ceiling:
        source: cameras.ceiling/image
        queue_size: 1
      arm_status_right:
        source: followers.right/status
      arm_status_left:
        source: followers.left/status
      # Motor temperatures and CAN bus state for the UI motor panel.
      arm_state_right: followers.right/state
      arm_state_left: followers.left/state
    outputs:
      - command
      - arm_command

  - id: quittable-tick-leader
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      # 250Hz
      tick: dora/timer/millis/4
    outputs:
      - tick

  - id: quittable-tick-camera
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      tick: dora/timer/millis/33 # 30fps
    outputs:
      - tick

  - id: leader
    module: modules/leader-${LEADER:-ker}.yaml
    inputs:
      tick: quittable-tick-leader/tick
      command: ui/command

  - id: followers
    module: modules/followers.yaml
    inputs:
      position_right: leader/follower_position_right
      position_left: leader/follower_position_left
      command: ui/arm_command

  - id: lifter
    path: dora-openarm-cell-lifter
    inputs:
      # The tick keeps the built-in hold behavior; the joystick comes only
      # from a VR leader.
      tick: quittable-tick-leader/tick
      joystick_y: leader/joystick_y_left
    outputs:
      - elevation_observation
      - elevation_action

  - id: cameras
    module: modules/cameras.yaml
    inputs:
      tick: quittable-tick-camera/tick

  - id: recorder
    path: dora-openarm-dataset-recorder
    env:
      METADATA_FILE: "${METADATA_FILE:-../metadata.yaml}"
      # Output directory for recorded datasets, e.g. ../data/webxr-cell.
      DIRECTORY: "../data/${LEADER:-ker}-cell"
    inputs:
      command: ui/command
      arm_right_action: leader/follower_position_right
      arm_left_action: leader/follower_position_left
      arm_right_observation: followers.right/state
      arm_left_observation: followers.left/state
      camera_wrist_right: cameras.wrist-right/image
      camera_wrist_left: cameras.wrist-left/image
      camera_head_left: cameras.head-stereo-splitter/image_0
      camera_head_right: cameras.head-stereo-splitter/image_1
      camera_ceiling: cameras.ceiling/image
      ker_metadata: leader/metadata
      elevation_action: lifter/elevation_action
      elevation_observation: lifter/elevation_observation
