# ROBOT=mujoco: simulated arms and 5 rendered cameras.
#
# Experimental: one dataflow per robot, with the leader picked by LEADER:
#
#   LEADER=ker|vr|webxr|dummy   modules/leader-$LEADER.yaml   (default: ker)
#
# dora doesn't expand environment variables in `module:`, so run it through
# ../scripts/dora-switch.sh, which does and also picks this file by ROBOT:
#
#   LEADER=webxr ROBOT=mujoco ../scripts/dora-switch.sh run --uv
#
# All leader modules have the same inputs and outputs; see
# modules/leader-ker.yaml.
#
# Nodes run with this file's directory (dataflow/) as their working directory,
# so file paths in env are relative to it and start with `../`.

nodes:
  - id: ui
    path: dora-openarm-data-collection-ui
    env:
      METADATA_FILE: "${METADATA_FILE:-../metadata_mujoco.yaml}"
    inputs:
      # We need at least one input to keep this node alive.
      tick: dora/timer/secs/1
      # Episode buttons and receive rate of a VR leader.
      button_a:
        source: leader/button_a
        queue_size: 100
      button_b:
        source: leader/button_b
        queue_size: 100
      vr_receive_times:
        source: leader/vr_receive_times
        queue_size: 100
      # KER receive rate and device information for the UI leader panel.
      ker_position: leader/ker_position
      ker_metadata: leader/metadata
      camera_wrist_right:
        source: mujoco/camera_wrist_right
        queue_size: 1
      camera_wrist_left:
        source: mujoco/camera_wrist_left
        queue_size: 1
      camera_head_left:
        source: mujoco/camera_head_left
        queue_size: 1
      camera_head_right:
        source: mujoco/camera_head_right
        queue_size: 1
      camera_ceiling:
        source: mujoco/camera_ceiling
        queue_size: 1
    outputs:
      - command

  - id: quittable-tick-leader
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      # 250Hz
      tick: dora/timer/millis/4
    outputs:
      - tick

  - id: quittable-tick-camera
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      tick: dora/timer/millis/33 # 30fps
    outputs:
      - tick

  - id: leader
    module: modules/leader-${LEADER:-ker}.yaml
    inputs:
      tick: quittable-tick-leader/tick
      command: ui/command

  - id: mujoco
    path: dora-openarm-mujoco
    args: "--scene demo --keyframe home --enable-collision --ctrl --viewer --render"
    inputs:
      move_position_right: leader/follower_position_right
      move_position_left: leader/follower_position_left
      request_state: quittable-tick-leader/tick
      joystick_y: leader/joystick_y_left
      button_x: leader/button_x
    outputs:
      - status
      - state_right
      - state_left
      - camera_wrist_right
      - camera_wrist_left
      - camera_head_left
      - camera_head_right
      - camera_ceiling

  - id: recorder
    path: dora-openarm-dataset-recorder
    env:
      METADATA_FILE: "${METADATA_FILE:-../metadata_mujoco.yaml}"
      # Output directory for recorded datasets, e.g. ../data/webxr-mujoco.
      DIRECTORY: "../data/${LEADER:-ker}-mujoco"
    inputs:
      command: ui/command
      arm_right_action: leader/follower_position_right
      arm_left_action: leader/follower_position_left
      arm_right_observation: mujoco/state_right
      arm_left_observation: mujoco/state_left
      camera_wrist_right: mujoco/camera_wrist_right
      camera_wrist_left: mujoco/camera_wrist_left
      camera_head_left: mujoco/camera_head_left
      camera_head_right: mujoco/camera_head_right
      camera_ceiling: mujoco/camera_ceiling
      ker_metadata: leader/metadata
