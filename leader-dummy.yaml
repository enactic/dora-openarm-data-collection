# LEADER=dummy: generated joint positions, no hardware.
# See leader-ker.yaml for the common inputs and outputs.
module:
  name: leader-dummy
  inputs:
    - tick
    - camera_head_left
    - camera_head_right
  outputs:
    - follower_position_right
    - follower_position_left
    - pose_right
    - pose_left
    - joystick_y_left
    - button_a
    - button_b
    - button_x
    - vr_receive_times
    - ker_position
    - metadata

nodes:
  - id: dummy-ker
    path: dora-openarm-dummy-ker
    inputs:
      tick: _mod/tick
    outputs:
      - position_right
      - position_left
      - follower_position_right
      - follower_position_left
      - joystick_x
      - joystick_y
      - joystick_button
      # Not sent by the dummy leader.
      - pose_right
      - pose_left
      - joystick_y_left
      - button_a
      - button_b
      - button_x
      - vr_receive_times
      - ker_position
      - metadata
