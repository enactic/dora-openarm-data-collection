# LEADER=ker: KER leader arms over USB send joint positions directly.
#
# Every leader-*.yaml declares the same inputs and outputs so that
# dataflow.yaml can wire whichever one LEADER picks. Inputs that this
# leader doesn't use are ignored, and outputs that it doesn't have are
# declared on a node that never sends them.
module:
  name: leader-ker
  inputs:
    - tick
    # Head camera images for a leader that shows them to the operator.
    - camera_head_left
    - camera_head_right
  outputs:
    - follower_position_right
    - follower_position_left
    # VR controller poses for a robot that draws them.
    - pose_right
    - pose_left
    - joystick_y_left
    - button_a
    - button_b
    - button_x
    - vr_receive_times
    - ker_position
    - metadata

nodes:
  - id: ker
    path: dora-openarm-ker
    inputs:
      tick: _mod/tick
    outputs:
      - follower_position_left
      - follower_position_right
      - metadata
      # Not sent by KER.
      - pose_right
      - pose_left
      - joystick_y_left
      - button_a
      - button_b
      - button_x
      - vr_receive_times

  # The UI shows the KER panel once `ker_position` arrives, so only this
  # leader sends it. A module output keeps its inner name, hence the rename.
  - id: ui-rate
    path: dora-echo
    inputs:
      ker_position: ker/follower_position_right
    outputs:
      - ker_position
