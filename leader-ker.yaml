# LEADER=ker: KER leader arms over USB send joint positions directly.
#
# The inputs and outputs below are common to all leader-*.yaml; see
# docs/design.md.
module:
  name: leader-ker
  inputs:
    - tick
    # Head camera images, e.g. for the WebXR headset.
    - camera_head_left
    - camera_head_right
  outputs:
    - follower_position_right
    - follower_position_left
    # VR controller poses for a robot that draws them.
    - pose_right
    - pose_left
    - joystick_y_left
    - button_a
    - button_b
    - button_x
    - vr_receive_times
    - ker_position
    - metadata

nodes:
  - id: ker
    path: dora-openarm-ker
    inputs:
      tick: _mod/tick
    outputs:
      - follower_position_right
      - follower_position_left
      - metadata
      # Not sent by KER.
      - pose_right
      - pose_left
      - joystick_y_left
      - button_a
      - button_b
      - button_x
      - vr_receive_times

  # Only KER sends `ker_position`: the UI shows the KER panel when it arrives.
  - id: out
    path: dora-echo
    inputs:
      ker_position: ker/follower_position_right
    outputs:
      - ker_position
