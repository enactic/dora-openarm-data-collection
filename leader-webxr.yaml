# LEADER=webxr: the headset browser sends controller poses over HTTPS 8443 and
# IK turns them into joint positions.
# See leader-ker.yaml for the common inputs and outputs.
module:
  name: leader-webxr
  inputs: [tick, command, camera_head_left, camera_head_right]
  outputs:
    - follower_position_right
    - follower_position_left
    - pose_right
    - pose_left
    - joystick_y_left
    - button_a
    - button_b
    - button_x
    - vr_receive_times
    - ker_position
    - metadata

# Env paths are not rewritten: nodes run in the dataflow's directory.
nodes:
  - id: webxr
    path: dora-openarm-webxr
    env:
      TLS_CERTIFICATE_FILE: "nodes/dora-openarm-webxr/example/server.crt"
      TLS_KEY_FILE: "nodes/dora-openarm-webxr/example/server.key"
      VIEW_CONFIGURATION_FILE: "view-webxr.yaml"
    inputs:
      # Closing these inputs on Quit lets the WebXR server and peers shut down.
      tick: _mod/tick
      # The head camera view in the headset; see view-webxr.yaml. The robot
      # closes them on Quit.
      camera_head_left:
        source: _mod/camera_head_left
        queue_size: 1
      camera_head_right:
        source: _mod/camera_head_right
        queue_size: 1
    outputs:
      - pose_right
      - trigger_right
      - pose_left
      - trigger_left
      - grip_right
      - grip_left
      - joystick_x_right
      - joystick_y_right
      - joystick_x_left
      - joystick_y_left
      - button_a
      - button_b
      - button_x
      - button_y
      - status
      - vr_receive_times
      - pose_reference

  # Closes the pose inputs of IK on Quit, and renames the IK outputs to the
  # common `follower_position_*`: a module output keeps its inner name.
  # WebXR stops only after the robot closes the cameras, and some robots,
  # e.g. the pedestal, close them only after their followers stop, so the
  # follower targets must stop on Quit without waiting for WebXR.
  - id: quittable-ik
    path: dora-openarm-quitter
    inputs:
      command: _mod/command
      target_right: webxr/pose_right
      trigger_right: webxr/trigger_right
      target_left: webxr/pose_left
      trigger_left: webxr/trigger_left
      follower_position_right: ik/position_right
      follower_position_left: ik/position_left
    outputs:
      # Not pose_*: webxr sends the module outputs with the names, and a
      # module output must have one producer.
      - target_right
      - trigger_right
      - target_left
      - trigger_left
      - follower_position_right
      - follower_position_left
      # Not sent by WebXR.
      - ker_position
      - metadata

  - id: ik
    path: dora-openarm-ik
    args: >-
      --mode bimanual --tick-hz 250
      --max-iters 5 --damping 0.1
      --posture-cost 0 --lm-damping 0.01 --limit-velocity
    inputs:
      target_right: quittable-ik/target_right
      target_left: quittable-ik/target_left
      trigger_right: quittable-ik/trigger_right
      trigger_left: quittable-ik/trigger_left
    outputs:
      - position_left
      - position_right
      - status
