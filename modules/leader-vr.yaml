# LEADER=vr: the Quest app sends controller poses over UDP 5006 and IK turns
# them into joint positions.
# See leader-ker.yaml for the common inputs and outputs.
module:
  name: leader-vr
  inputs:
    - tick
    - camera_head_left
    - camera_head_right
  outputs:
    - follower_position_right
    - follower_position_left
    - pose_right
    - pose_left
    - joystick_y_left
    - button_a
    - button_b
    - button_x
    - vr_receive_times
    - ker_position
    - metadata

nodes:
  - id: udp-receiver
    path: dora-openarm-quest-receiver
    args: "--host 0.0.0.0 --port 5006"
    inputs:
      tick: _mod/tick
    outputs:
      - pose_right
      - trigger_right
      - pose_left
      - trigger_left
      - joystick_y_left
      - button_a
      - button_b
      - button_x
      - status
      - vr_receive_times

  - id: ik
    path: dora-openarm-ik
    args: >-
      --mode bimanual --tick-hz 250
      --max-iters 5 --damping 0.1
      --posture-cost 0 --lm-damping 0.01 --limit-velocity
    inputs:
      target_right: udp-receiver/pose_right
      target_left: udp-receiver/pose_left
      trigger_right: udp-receiver/trigger_right
      trigger_left: udp-receiver/trigger_left
    outputs:
      - position_right
      - position_left
      - status

  # Renames the IK outputs to the common `follower_position_*`.
  - id: out
    path: dora-echo
    inputs:
      follower_position_right: ik/position_right
      follower_position_left: ik/position_left
    outputs:
      - follower_position_right
      - follower_position_left
      # Not sent by VR.
      - ker_position
      - metadata
