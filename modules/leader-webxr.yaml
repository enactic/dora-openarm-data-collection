# LEADER=webxr: the headset browser sends controller poses over HTTPS 8443 and
# IK turns them into joint positions.
# See leader-ker.yaml for the common inputs and outputs.
module:
  name: leader-webxr
  inputs:
    - tick
    - camera_head_left
    - camera_head_right
  outputs:
    - follower_position_right
    - follower_position_left
    - pose_right
    - pose_left
    - joystick_y_left
    - button_a
    - button_b
    - button_x
    - vr_receive_times
    - ker_position
    - metadata

# Env paths are relative to dataflow.yaml's directory.
nodes:
  - id: webxr
    path: dora-openarm-webxr
    env:
      TLS_CERTIFICATE_FILE: "nodes/dora-openarm-webxr/example/server.crt"
      TLS_KEY_FILE: "nodes/dora-openarm-webxr/example/server.key"
      VIEW_CONFIGURATION_FILE: "view-webxr.yaml"
    inputs:
      # WebXR stops when all its inputs are closed on Quit.
      tick: _mod/tick
      # The head camera view in the headset; see view-webxr.yaml.
      camera_head_left:
        source: _mod/camera_head_left
        queue_size: 1
      camera_head_right:
        source: _mod/camera_head_right
        queue_size: 1
    outputs:
      - pose_right
      - trigger_right
      - pose_left
      - trigger_left
      - grip_right
      - grip_left
      - joystick_x_right
      - joystick_y_right
      - joystick_x_left
      - joystick_y_left
      - button_a
      - button_b
      - button_x
      - button_y
      - status
      - vr_receive_times
      - pose_reference

  - id: ik
    path: dora-openarm-ik
    args: >-
      --mode bimanual --tick-hz 250
      --max-iters 5 --damping 0.1
      --posture-cost 0 --lm-damping 0.01 --limit-velocity
    inputs:
      target_right: webxr/pose_right
      target_left: webxr/pose_left
      trigger_right: webxr/trigger_right
      trigger_left: webxr/trigger_left
    outputs:
      - position_right
      - position_left
      - status

  # Renames the IK outputs to the common `follower_position_*`.
  - id: out
    path: dora-echo
    inputs:
      follower_position_right: ik/position_right
      follower_position_left: ik/position_left
    outputs:
      - follower_position_right
      - follower_position_left
      # Not sent by WebXR.
      - ker_position
      - metadata
