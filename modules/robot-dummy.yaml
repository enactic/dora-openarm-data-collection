# ROBOT=dummy: no hardware. Arms echo their targets and cameras send test
# images.
# See robot-cell.yaml for the common inputs and outputs.
module:
  name: robot-dummy
  inputs:
    - tick
    - camera_tick
    - command
    - arm_command
    - position_right
    - position_left
    - joystick_y
    - button_x
    - pose_right
    - pose_left
  outputs:
    - state_right
    - state_left
    - arm_state_right
    - arm_state_left
    - status_right
    - status_left
    - camera_wrist_right
    - camera_wrist_left
    - camera_head_left
    - camera_head_right
    - camera_ceiling
    - elevation_action
    - elevation_observation

nodes:
  - id: right
    path: dora-openarm-dummy
    inputs:
      # Event ID is only used. Event value isn't used.
      request_position: _mod/position_right
      move_position: _mod/position_right
    outputs:
      - position
      - status

  - id: left
    path: dora-openarm-dummy
    inputs:
      request_position: _mod/position_left
      move_position: _mod/position_left
    outputs:
      - position
      - status

  # Renames the arms' outputs to the common names.
  - id: arms
    path: dora-echo
    inputs:
      state_right: right/position
      state_left: left/position
      status_right: right/status
      status_left: left/status
    outputs:
      - state_right
      - state_left
      - status_right
      - status_left
      # Not sent by the dummy robot.
      - arm_state_right
      - arm_state_left
      - elevation_action
      - elevation_observation

  - id: wrist-right
    path: dora-openarm-dummy-camera
    env: &dummy_camera_env
      ENCODING: "jpeg"
      IMAGE_HEIGHT: 600
      IMAGE_WIDTH: 960
      JPEG_QUALITY: 90
    inputs:
      tick: _mod/camera_tick
    outputs:
      - image

  - id: wrist-left
    path: dora-openarm-dummy-camera
    env: *dummy_camera_env
    inputs:
      tick: _mod/camera_tick
    outputs:
      - image

  - id: head-left
    path: dora-openarm-dummy-camera
    env: *dummy_camera_env
    inputs:
      tick: _mod/camera_tick
    outputs:
      - image

  - id: head-right
    path: dora-openarm-dummy-camera
    env: *dummy_camera_env
    inputs:
      tick: _mod/camera_tick
    outputs:
      - image

  - id: ceiling
    path: dora-openarm-dummy-camera
    env: *dummy_camera_env
    inputs:
      tick: _mod/camera_tick
    outputs:
      - image

  # Renames `image` of each camera to the common names. Stops on Quit with
  # the cameras because `camera_tick` is closed.
  - id: cameras
    path: dora-echo
    inputs:
      camera_wrist_right: wrist-right/image
      camera_wrist_left: wrist-left/image
      camera_head_left: head-left/image
      camera_head_right: head-right/image
      camera_ceiling: ceiling/image
    outputs:
      - camera_wrist_right
      - camera_wrist_left
      - camera_head_left
      - camera_head_right
      - camera_ceiling
