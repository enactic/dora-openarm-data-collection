# ROBOT=pedestal: real arms on a pedestal. Followers on CAN, 2 wrist cameras
# + head stereo camera with its splitter. No lifter and no ceiling camera.
# See robot-cell.yaml for the common inputs and outputs.
module:
  name: robot-pedestal
  inputs:
    - tick
    - camera_tick
    - command
    - arm_command
    - position_right
    - position_left
    - joystick_y
    - button_x
    - pose_right
    - pose_left
  outputs:
    - state_right
    - state_left
    - arm_state_right
    - arm_state_left
    - status_right
    - status_left
    - camera_wrist_right
    - camera_wrist_left
    - camera_head_left
    - camera_head_right
    - camera_ceiling
    - elevation_action
    - elevation_observation

nodes:
  - id: right
    path: ../dora-openarm
    args: "--side right --align-trigger gripper --config openarm_pedestal"
    inputs:
      # Event ID is only used. Event value isn't used.
      request_state: _mod/position_right
      move_position: _mod/position_right
      command: _mod/arm_command
    outputs:
      - state
      - status

  - id: left
    path: ../dora-openarm
    args: "--side left --align-trigger gripper --config openarm_pedestal"
    inputs:
      request_state: _mod/position_left
      move_position: _mod/position_left
      command: _mod/arm_command
    outputs:
      - state
      - status

  # Renames the followers' outputs to the common names.
  - id: arms
    path: ../dora-echo
    inputs:
      state_right: right/state
      state_left: left/state
      arm_state_right: right/state
      arm_state_left: left/state
      status_right: right/status
      status_left: left/status
    outputs:
      - state_right
      - state_left
      - arm_state_right
      - arm_state_left
      - status_right
      - status_left
      # Not sent by the pedestal.
      - elevation_action
      - elevation_observation

  - id: wrist-right
    path: ../opencv-video-capture
    env:
      # Please configure!
      CAPTURE_PATH: "/dev/camera_wrist_right"
      ENCODING: "jpeg"
      IMAGE_HEIGHT: 600
      IMAGE_WIDTH: 960
      JPEG_QUALITY: 90
    inputs:
      tick: _mod/camera_tick
    outputs:
      - image

  - id: wrist-left
    path: ../opencv-video-capture
    env:
      # Please configure!
      CAPTURE_PATH: "/dev/camera_wrist_left"
      ENCODING: "jpeg"
      IMAGE_HEIGHT: 600
      IMAGE_WIDTH: 960
      JPEG_QUALITY: 90
    inputs:
      tick: _mod/camera_tick
    outputs:
      - image

  - id: head-stereo
    path: ../opencv-video-capture
    env:
      # Please configure!
      # Stereo camera: left and right images placed side by side in one frame.
      CAPTURE_PATH: "/dev/camera_head_stereo"
      ENCODING: "bgr8"
      IMAGE_HEIGHT: 720
      IMAGE_WIDTH: 2560
    inputs:
      tick: _mod/camera_tick
    outputs:
      - image

  - id: head-stereo-splitter
    path: ../dora-opencv-image-splitter
    env:
      SPLIT_MODE: "vertical"
      NUM_SPLITS: 2
      JPEG_QUALITY: 90
      IMAGE_HEIGHT: 720
      IMAGE_WIDTH: 2560
    inputs:
      image: head-stereo/image
    outputs:
      - image_0
      - image_1

  # Renames `image` of each camera to the common names. Stops on Quit with
  # the cameras because `camera_tick` is closed.
  - id: cameras
    path: ../dora-echo
    inputs:
      camera_wrist_right: wrist-right/image
      camera_wrist_left: wrist-left/image
      camera_head_left: head-stereo-splitter/image_0
      camera_head_right: head-stereo-splitter/image_1
    outputs:
      - camera_wrist_right
      - camera_wrist_left
      - camera_head_left
      - camera_head_right

  # No ceiling camera. Closes its output on Quit.
  - id: quittable-ceiling
    path: ../dora-openarm-quitter
    inputs:
      command: _mod/command
    outputs:
      # Not sent by the pedestal.
      - camera_ceiling
