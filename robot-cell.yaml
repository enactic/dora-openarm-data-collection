# ROBOT=cell: the real Cell. Followers on CAN, lifter, 4 cameras + stereo
# splitter.
#
# The inputs and outputs below are common to all robot-*.yaml; see
# docs/design.md.
module:
  name: robot-cell
  inputs:
    # 250Hz
    - tick
    # 30fps
    - camera_tick
    # `quit` to stop the robot.
    - command
    # `start`/`stop` for the arms.
    - arm_command
    # Target joint positions.
    - position_right
    - position_left
    # Lifter controls of a VR leader.
    - joystick_y
    - button_x
    # VR controller poses for the MuJoCo `--debug-frames` overlay.
    - pose_right
    - pose_left
  outputs:
    # Observation to record.
    - state_right
    - state_left
    # Motor temperatures and CAN bus state for the UI motor panel.
    - arm_state_right
    - arm_state_left
    # Arm status for the UI.
    - status_right
    - status_left
    - camera_wrist_right
    - camera_wrist_left
    - camera_head_left
    - camera_head_right
    - camera_ceiling
    - elevation_action
    - elevation_observation

nodes:
  - id: right
    path: dora-openarm
    args: "--side right --align-trigger gripper --config openarm_cell_higher_pd_zero_offset"
    inputs:
      # Event ID is only used. Event value isn't used.
      request_state: _mod/position_right
      move_position: _mod/position_right
      command: _mod/arm_command
    outputs:
      - state
      - status

  - id: left
    path: dora-openarm
    args: "--side left --align-trigger gripper --config openarm_cell_higher_pd_zero_offset"
    inputs:
      request_state: _mod/position_left
      move_position: _mod/position_left
      command: _mod/arm_command
    outputs:
      - state
      - status

  # Renames the followers' outputs to the common names.
  - id: arms
    path: dora-echo
    inputs:
      state_right: right/state
      state_left: left/state
      arm_state_right: right/state
      arm_state_left: left/state
      status_right: right/status
      status_left: left/status
    outputs:
      - state_right
      - state_left
      - arm_state_right
      - arm_state_left
      - status_right
      - status_left

  - id: lifter
    path: dora-openarm-cell-lifter
    inputs:
      # The tick keeps the built-in hold behavior; the joystick comes only
      # from a VR leader.
      tick: _mod/tick
      joystick_y: _mod/joystick_y
    outputs:
      - elevation_action
      - elevation_observation

  - id: wrist-right
    path: opencv-video-capture
    env:
      # Please configure!
      CAPTURE_PATH: "/dev/camera_wrist_right"
      ENCODING: "jpeg"
      IMAGE_HEIGHT: 600
      IMAGE_WIDTH: 960
      JPEG_QUALITY: 90
    inputs:
      tick: _mod/camera_tick
    outputs:
      - image

  - id: wrist-left
    path: opencv-video-capture
    env:
      # Please configure!
      CAPTURE_PATH: "/dev/camera_wrist_left"
      ENCODING: "jpeg"
      IMAGE_HEIGHT: 600
      IMAGE_WIDTH: 960
      JPEG_QUALITY: 90
    inputs:
      tick: _mod/camera_tick
    outputs:
      - image

  - id: head-stereo
    path: opencv-video-capture
    env:
      # Please configure!
      # Stereo camera: left and right images placed side by side in one frame.
      CAPTURE_PATH: "/dev/camera_head_stereo"
      ENCODING: "bgr8"
      IMAGE_HEIGHT: 720
      IMAGE_WIDTH: 2560
    inputs:
      tick: _mod/camera_tick
    outputs:
      - image

  - id: head-stereo-splitter
    path: dora-opencv-image-splitter
    env:
      SPLIT_MODE: "vertical"
      NUM_SPLITS: 2
      JPEG_QUALITY: 90
      IMAGE_HEIGHT: 720
      IMAGE_WIDTH: 2560
    inputs:
      image: head-stereo/image
    outputs:
      - image_0
      - image_1

  - id: ceiling
    path: opencv-video-capture
    env:
      # Please configure!
      CAPTURE_PATH: "/dev/camera_ceiling"
      ENCODING: "jpeg"
      IMAGE_HEIGHT: 600
      IMAGE_WIDTH: 960
      JPEG_QUALITY: 90
    inputs:
      tick: _mod/camera_tick
    outputs:
      - image

  # Renames `image` of each camera to the common names. Stops on Quit with
  # the cameras because `camera_tick` is closed.
  - id: cameras
    path: dora-echo
    inputs:
      camera_wrist_right: wrist-right/image
      camera_wrist_left: wrist-left/image
      camera_head_left: head-stereo-splitter/image_0
      camera_head_right: head-stereo-splitter/image_1
      camera_ceiling: ceiling/image
    outputs:
      - camera_wrist_right
      - camera_wrist_left
      - camera_head_left
      - camera_head_right
      - camera_ceiling
