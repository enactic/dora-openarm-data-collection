# ROBOT=mujoco: simulated arms and 5 rendered cameras.
# See robot-cell.yaml for the common inputs and outputs.
module:
  name: robot-mujoco
  inputs:
    - tick
    - camera_tick
    - command
    - arm_command
    - position_right
    - position_left
    - joystick_y
    - button_x
  outputs:
    - state_right
    - state_left
    - arm_state_right
    - arm_state_left
    - status_right
    - status_left
    - camera_wrist_right
    - camera_wrist_left
    - camera_head_left
    - camera_head_right
    - camera_ceiling
    - elevation_action
    - elevation_observation

nodes:
  - id: mujoco
    path: dora-openarm-mujoco
    args: "--scene demo --keyframe home --enable-collision --ctrl --viewer --render"
    inputs:
      move_position_right: controls/position_right
      move_position_left: controls/position_left
      request_state: _mod/tick
      joystick_y: controls/joystick_y
      button_x: controls/button_x
    outputs:
      - status
      - state_right
      - state_left
      - camera_wrist_right
      - camera_wrist_left
      - camera_head_left
      - camera_head_right
      - camera_ceiling
      # Not sent by MuJoCo.
      - arm_state_right
      - arm_state_left
      - status_right
      - status_left
      - elevation_action
      - elevation_observation

  # The cameras are rendered from the leader's inputs, and a leader may wait
  # for the cameras, e.g. WebXR. Close all inputs from the leader on Quit so
  # that MuJoCo stops and closes the cameras whichever leader is used.
  - id: controls
    path: dora-openarm-quitter
    inputs:
      command: _mod/command
      position_right: _mod/position_right
      position_left: _mod/position_left
      joystick_y: _mod/joystick_y
      button_x: _mod/button_x
    outputs:
      - position_right
      - position_left
      - joystick_y
      - button_x
